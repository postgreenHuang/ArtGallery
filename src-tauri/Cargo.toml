[package]
name = "atelier-gallery"
version = "0.1.0"
description = "A quiet personal art gallery"
edition = "2021"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "system-proxy"] }
tokio = { version = "1", features = ["fs", "sync", "io-util"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
rfd = "0.15"
fs2 = "0.4"
tauri-plugin-opener = "2"
chrono = "0.4"

